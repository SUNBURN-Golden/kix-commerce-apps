name: Commerce apps CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commerce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desk:
    name: Typecheck, build, and test (stub)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # The live gate runs in its own job below. This job skips it on purpose.
      - run: npm test
        env:
          KIX_REQUIRE_GATE: '0'

  gate-token:
    name: Check for the protocol read token
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          # kix-protocol is private. A read-only token for it is needed to check out the gate.
          HAS_PROTOCOL_TOKEN: ${{ secrets.KIX_PROTOCOL_READ_TOKEN != '' }}
        run: |
          echo "present=$HAS_PROTOCOL_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_PROTOCOL_TOKEN" != "true" ]; then
            echo "::warning title=Live gate not run::Set the KIX_PROTOCOL_READ_TOKEN secret (read-only contents on BeautifulMind-JT/kix-protocol) to run the adapter tests against the reviewed gate."
            echo "Live gate not run: KIX_PROTOCOL_READ_TOKEN is not set. The live-gate job is skipped, not passed." >> "$GITHUB_STEP_SUMMARY"
          fi

  live-gate:
    name: Adapter tests against the reviewed gate
    needs: gate-token
    # Without the token this job shows as skipped, never as a pass.
    if: needs.gate-token.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Must equal OPENAPI_INTEGRATION_GATE_PIN.protocolMergeSha. A test checks this.
      KIX_PROTOCOL_GATE_SHA: 52a9b5cbf7777df55d2d2062cb8d99d862b423bb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BeautifulMind-JT/kix-protocol
          ref: ${{ env.KIX_PROTOCOL_GATE_SHA }}
          token: ${{ secrets.KIX_PROTOCOL_READ_TOKEN }}
          path: .kix-protocol-gate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -w @kix/protocol-adapter
        env:
          KIX_PROTOCOL_ROOT: ${{ github.workspace }}/.kix-protocol-gate
          KIX_REQUIRE_GATE: '1'
