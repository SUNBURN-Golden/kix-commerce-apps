<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The visual baseline suite launches Chrome with FONTCONFIG_FILE pointing at
  this file, so the only fonts the browser can resolve are the four vendored
  files in this directory. Nothing about the machine's installed fonts reaches
  a screenshot. fontconfig resolves <dir> relative to this file's location.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>NanumGothic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>NanumMyeongjo</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>NanumGothic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Avenir Next</family>
    <prefer><family>NanumGothic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI</family>
    <prefer><family>NanumGothic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Palatino</family>
    <prefer><family>NanumMyeongjo</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Iowan Old Style</family>
    <prefer><family>NanumMyeongjo</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Georgia</family>
    <prefer><family>NanumMyeongjo</family></prefer>
  </alias>
</fontconfig>
